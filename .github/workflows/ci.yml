name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          set -o pipefail
          dotnet restore backend/DocuMind.slnx 2>&1 | tee restore.log || true
          code=${PIPESTATUS[0]}
          echo '## Restore output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE 'error|warn|NU[0-9]+|unable|not found|no se encuentra' restore.log | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Build
        run: dotnet build backend/DocuMind.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/DocuMind.slnx --no-build -c Release --verbosity normal
