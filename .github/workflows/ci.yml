name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          set +e
          dotnet restore backend/DocuMind.slnx > restore.log 2>&1
          code=$?
          cat restore.log
          if [ $code -ne 0 ]; then
            grep -iE 'error|NU[0-9]+|unable|not found|no se encuentra|does not exist' restore.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Build
        run: dotnet build backend/DocuMind.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/DocuMind.slnx --no-build -c Release --verbosity normal
