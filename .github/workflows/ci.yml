name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/DocuMind.slnx

      - name: Build
        run: dotnet build backend/DocuMind.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/DocuMind.slnx --no-build -c Release --verbosity normal
