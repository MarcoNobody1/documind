<div hlmCard class="w-full max-w-sm">
  <div hlmCardHeader>
    <h2 hlmCardTitle class="text-xl font-semibold">Register</h2>
    <p hlmCardDescription>Chat with your documents — every answer cites the page it came from.</p>
  </div>

  <div hlmCardContent>
    <form class="flex flex-col gap-4" (submit)="$event.preventDefault(); submit()">
      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="register-email">Email</label>
        <input
          hlmInput
          id="register-email"
          type="email"
          [value]="email()"
          (input)="onEmailInput($event)"
          [disabled]="isSubmitting()"
          required
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="register-password">Password</label>
        <input
          hlmInput
          id="register-password"
          type="password"
          [value]="password()"
          (input)="onPasswordInput($event)"
          [disabled]="isSubmitting()"
          required
        />
      </div>

      @if (lastMessage()) {
        <p class="text-sm text-destructive">{{ lastMessage() }}</p>
      }

      <button hlmBtn type="submit" [disabled]="isSubmitting()" class="w-full">Register</button>
    </form>
  </div>

  <div hlmCardFooter class="justify-center text-sm text-muted-foreground">
    Already have an account?
    <a routerLink="/login" class="text-primary underline-offset-4 hover:underline">Log in</a>
  </div>
</div>
