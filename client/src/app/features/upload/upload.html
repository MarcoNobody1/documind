<div>
  <label class="text-sm font-medium" for="upload-file-input">Upload a document</label>
  <p class="text-xs text-muted-foreground">Add a PDF. It becomes searchable by every question below.</p>
</div>

<input
  id="upload-file-input"
  type="file"
  accept="application/pdf"
  class="text-sm"
  [disabled]="isUploading()"
  (change)="onFileSelected($event)"
/>

@if (isUploading()) {
  <p class="text-sm text-muted-foreground">Uploading&hellip;</p>
}

@if (message()) {
  <p class="text-sm" [class.text-destructive]="messageIsWarning()">{{ message() }}</p>
}
